<header class="site-header px2 px-responsive">
  <div class="header-inner wrap">
    <a href="{{ '/' | prepend: site.baseurl }}" class="site-title" aria-label="{{ site.title }} — home">
      <span class="site-mark" aria-hidden="true">SG</span>
      <span class="site-name">Shashank Gupta</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Open navigation">
      <span></span><span></span>
    </button>
    <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
      <a href="{{ site.baseurl }}/publications/"{% if page.url == '/publications/' %} class="is-active" aria-current="page"{% endif %}>Research</a>
      <a href="{{ site.baseurl }}/talks/"{% if page.url == '/talks/' %} class="is-active" aria-current="page"{% endif %}>Talks</a>
      <a href="{{ site.baseurl }}/resume-final.pdf">CV ↗</a>
      <a href="{{ site.baseurl }}/contact/" class="nav-contact{% if page.url == '/contact/' %} is-active{% endif %}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
